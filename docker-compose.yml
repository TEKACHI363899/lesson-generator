version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eng_lesson_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${DB_NAME:-eng_lesson_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eng_lesson_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eng_studio_net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: eng_lesson_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      DB_NAME: ${DB_NAME:-eng_lesson_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_eng_studio_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400s}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - eng_studio_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: eng_lesson_web
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - eng_studio_net

networks:
  eng_studio_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
